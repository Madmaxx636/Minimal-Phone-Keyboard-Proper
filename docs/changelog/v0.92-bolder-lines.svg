<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#000000">Bolder, solid-black outlines - before vs after</text>

  <!-- Row 1: toolbar keycap button -->
  <text x="20" y="70" font-size="14" fill="#000000">Toolbar keycap button (Sym / emoji / voice / shift)</text>
  <g transform="translate(20,90)">
    <rect width="120" height="120" rx="26" fill="#ffffff" stroke="#8a8a8a" stroke-width="8"/>
    <text x="60" y="70" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">SYM</text>
    <text x="60" y="145" font-size="12" text-anchor="middle" fill="#555555">current</text>
  </g>
  <g transform="translate(180,90)">
    <rect width="120" height="120" rx="26" fill="#ffffff" stroke="#000000" stroke-width="9"/>
    <text x="60" y="70" font-size="24" font-weight="bold" text-anchor="middle" fill="#000000">SYM</text>
    <text x="60" y="145" font-size="12" text-anchor="middle" fill="#555555">after</text>
  </g>

  <!-- Row 1b: sym map / grid tile -->
  <text x="380" y="70" font-size="14" fill="#000000">Sym map / Sym-Layer View key tile</text>
  <g transform="translate(380,90)">
    <rect width="100" height="120" rx="14" fill="#ffffff" stroke="#a9a9a9" stroke-width="3"/>
    <text x="50" y="72" font-size="28" font-weight="bold" text-anchor="middle" fill="#000000">&#8364;</text>
    <text x="12" y="22" font-size="11" fill="#000000">e</text>
    <text x="50" y="145" font-size="12" text-anchor="middle" fill="#555555">current</text>
  </g>
  <g transform="translate(500,90)">
    <rect width="100" height="120" rx="14" fill="#ffffff" stroke="#000000" stroke-width="3.4"/>
    <text x="50" y="72" font-size="28" font-weight="bold" text-anchor="middle" fill="#000000">&#8364;</text>
    <text x="12" y="22" font-size="11" fill="#000000">e</text>
    <text x="50" y="145" font-size="12" text-anchor="middle" fill="#555555">after</text>
  </g>

  <!-- Row 2: settings switch + dropdown -->
  <text x="20" y="280" font-size="14" fill="#000000">Settings switch and dropdown border</text>
  <g transform="translate(20,300)">
    <rect x="0" y="10" width="46" height="20" rx="10" fill="#000000" stroke="#000000" stroke-width="2"/>
    <circle cx="35" cy="20" r="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <rect x="70" y="5" width="100" height="30" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="78" y="25" font-size="13" fill="#000000">Multipress</text>
    <text x="85" y="65" font-size="12" fill="#555555">current</text>
  </g>
  <g transform="translate(280,300)">
    <rect x="0" y="10" width="46" height="20" rx="10" fill="#000000" stroke="#000000" stroke-width="2.5"/>
    <circle cx="35" cy="20" r="10" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <rect x="70" y="5" width="100" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <text x="78" y="25" font-size="13" fill="#000000">Multipress</text>
    <text x="85" y="65" font-size="12" fill="#555555">after</text>
  </g>

  <!-- Row 3: divider line -->
  <text x="20" y="420" font-size="14" fill="#000000">Toolbar and settings divider line</text>
  <g transform="translate(20,440)">
    <line x1="0" y1="10" x2="220" y2="10" stroke="#9e9e9e" stroke-width="1"/>
    <text x="0" y="35" font-size="12" fill="#555555">current (light gray, 1dp)</text>
  </g>
  <g transform="translate(280,440)">
    <line x1="0" y1="10" x2="220" y2="10" stroke="#000000" stroke-width="2.5"/>
    <text x="0" y="35" font-size="12" fill="#555555">after (solid black, +12.5%)</text>
  </g>

  <text x="20" y="590" font-size="11" fill="#777777">Illustrative close-ups, not device screenshots - the actual line-width increase on screen is closer to 12.5% than shown here.</text>
</svg>
